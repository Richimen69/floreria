services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: floreria
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d floreria"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: &compilacion
      context: .
      network: host
      args:
        DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@127.0.0.1:5432/floreria
        R2_PUBLIC_URL: ${R2_PUBLIC_URL}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/floreria
    depends_on:
      postgres:
        condition: service_healthy

  migrar:
    build:
      <<: *compilacion
      target: migrador
    profiles: ["herramientas"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/floreria
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: