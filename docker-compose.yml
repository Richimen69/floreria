services:
  postgres:
    image: postgres:17
    container_name: floreria-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: floreria
      POSTGRES_DB: floreria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d floreria"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: