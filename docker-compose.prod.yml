# Nombre fijo del proyecto: evita que choque con el de pruebas en el mismo servidor
name: floreria-produccion

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: floreria
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 5433 para no chocar con la base de pruebas (5432); solo accesible desde el propio servidor
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d floreria"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: &compilacion
      context: .
      network: host
      args:
        DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@127.0.0.1:5433/floreria
        R2_PUBLIC_URL: ${R2_PUBLIC_URL}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/floreria
    depends_on:
      postgres:
        condition: service_healthy
    # Sin "ports": la app no se publica; solo el túnel llega a ella

  migrar:
    build:
      <<: *compilacion
      target: migrador
    profiles: ["herramientas"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/floreria
    depends_on:
      postgres:
        condition: service_healthy

  tunel:
    image: cloudflare/cloudflared:2026.11.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  pgdata: